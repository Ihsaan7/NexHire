openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Pakistani Job Aggregator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: profile
    description: User profile and CV management
  - name: jobs
    description: Job listings
  - name: savedJobs
    description: Saved and tracked jobs
  - name: cron
    description: Data ingestion
  - name: gigs
    description: Side-income gig listings
  - name: practice
    description: Interview and skill practice

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user's profile
      responses:
        "200":
          description: Profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update user preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/cv:
    post:
      operationId: uploadCv
      tags: [profile]
      summary: Upload CV (PDF or DOCX) — extracts text and generates embedding
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvFileInput"
      responses:
        "200":
          description: CV processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvUploadResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/cv/suggestions:
    get:
      operationId: getCvSuggestions
      tags: [profile]
      summary: Get AI suggestions to improve the CV
      responses:
        "200":
          description: Suggestions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvSuggestions"

  /profile/cv/audit:
    post:
      operationId: auditCv
      tags: [profile]
      summary: Audit the current user's CV against Pakistani CV standards
      responses:
        "200":
          description: CV audit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvAuditResult"
        "400":
          description: No CV uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/cv/refine:
    post:
      operationId: refineCv
      tags: [profile]
      summary: Refine the current user's CV for a specific job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvRefineInput"
      responses:
        "200":
          description: Refined CV result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvRefineResult"
        "400":
          description: Missing job description or CV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /practice/start:
    post:
      operationId: startPracticeSession
      tags: [practice]
      summary: Start an AI interview or skill practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeStartInput"
      responses:
        "200":
          description: Practice session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeStartResult"
        "400":
          description: Invalid practice setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /practice/message:
    post:
      operationId: sendPracticeMessage
      tags: [practice]
      summary: Submit an answer and receive AI feedback or the next question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PracticeMessageInput"
      responses:
        "200":
          description: Practice feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PracticeMessageResult"
        "400":
          description: Invalid practice answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List jobs with filters
      parameters:
        - name: sector
          in: query
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: experienceLevel
          in: query
          schema:
            type: string
        - name: jobType
          in: query
          schema:
            type: string
        - name: postedWithin
          in: query
          description: today | week | month
          schema:
            type: string
            enum: [today, week, month]
        - name: deadlineWithin
          in: query
          description: 3days | week | month
          schema:
            type: string
            enum: [3days, week, month]
        - name: minMatchScore
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

  /jobs/matched:
    get:
      operationId: getMatchedJobs
      tags: [jobs]
      summary: Get top AI-matched jobs for the current user's CV
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
      responses:
        "200":
          description: Matched jobs with scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchedJobsResponse"

  /jobs/stats:
    get:
      operationId: getJobStats
      tags: [jobs]
      summary: Get job count stats by sector
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobStats"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{id}/analyze:
    get:
      operationId: analyzeJobMatch
      tags: [jobs]
      summary: Get AI match analysis for a job vs current user's CV (cached)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchAnalysis"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /saved-jobs:
    get:
      operationId: listSavedJobs
      tags: [savedJobs]
      summary: List all saved/tracked jobs for the current user
      responses:
        "200":
          description: Saved jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedJob"
    post:
      operationId: saveJob
      tags: [savedJobs]
      summary: Save a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedJobInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJob"

  /saved-jobs/{id}:
    patch:
      operationId: updateSavedJob
      tags: [savedJobs]
      summary: Update status or notes on a saved job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SavedJobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJob"
    delete:
      operationId: deleteSavedJob
      tags: [savedJobs]
      summary: Remove a saved job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  /cron/sync-adzuna:
    post:
      operationId: syncAdzuna
      tags: [cron]
      summary: Trigger Adzuna job sync (protected by CRON_SECRET)
      responses:
        "202":
          description: Sync started in the background
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cron/sync-gigs:
    post:
      operationId: syncGigs
      tags: [cron]
      summary: Trigger gig sync from RemoteOK, Jobicy, Remotive, WWR (protected by CRON_SECRET)
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /gigs:
    get:
      operationId: listGigs
      tags: [gigs]
      summary: List side-income gigs with filters and value scoring
      parameters:
        - name: taskType
          in: query
          schema:
            type: string
        - name: payModel
          in: query
          schema:
            type: string
        - name: difficulty
          in: query
          schema:
            type: string
        - name: minLegitScore
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 100
        - name: showLowTrust
          in: query
          schema:
            type: string
            enum: ["true", "false"]
        - name: sort
          in: query
          schema:
            type: string
            enum: [value, newest, pay, legit]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Gig list with value scoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GigListResponse"

  /gigs/sync:
    post:
      operationId: triggerGigSync
      tags: [gigs]
      summary: Trigger an authenticated gig sync in the background
      responses:
        "202":
          description: Sync started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CvFileInput:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
        - file

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserPreferences:
      type: object
      properties:
        sectors:
          type: array
          items:
            type: string
        locations:
          type: array
          items:
            type: string
        experienceLevel:
          type: string
        minMatchScore:
          type: number
          minimum: 0
          maximum: 100

    Profile:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        cvText:
          type: ["string", "null"]
        cvUpdatedAt:
          type: ["string", "null"]
        cvAudit:
          allOf:
            - $ref: "#/components/schemas/CvAuditResult"
            - type: object
              properties:
                generatedAt:
                  type: string
              required:
                - generatedAt
        cvRefinement:
          allOf:
            - $ref: "#/components/schemas/CvRefineResult"
            - type: object
              properties:
                jobTitle:
                  type: ["string", "null"]
                jobDescription:
                  type: string
                generatedAt:
                  type: string
              required:
                - jobTitle
                - jobDescription
                - generatedAt
        preferences:
          $ref: "#/components/schemas/UserPreferences"
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - userId

    ProfileUpdate:
      type: object
      properties:
        preferences:
          $ref: "#/components/schemas/UserPreferences"

    CvUploadResult:
      type: object
      properties:
        success:
          type: boolean
        cvTextLength:
          type: integer
        cvUpdatedAt:
          type: string
      required:
        - success
        - cvTextLength
        - cvUpdatedAt

    CvSuggestions:
      type: object
      properties:
        suggestions:
          type: array
          items:
            type: string
        generatedAt:
          type: string
      required:
        - suggestions
        - generatedAt

    CvAuditIssue:
      type: object
      properties:
        category:
          type: string
        severity:
          type: string
          enum: [high, medium, low]
        problem:
          type: string
        correction:
          type: string
      required:
        - category
        - severity
        - problem
        - correction

    CvAuditResult:
      type: object
      properties:
        score:
          type: number
        issues:
          type: array
          items:
            $ref: "#/components/schemas/CvAuditIssue"
        strengths:
          type: array
          items:
            type: string
      required:
        - score
        - issues
        - strengths

    CvRefineInput:
      type: object
      properties:
        jobTitle:
          type: string
        jobDescription:
          type: string
          minLength: 1
      required:
        - jobDescription

    CvRefineResult:
      type: object
      properties:
        refinedCv:
          type: string
        changes:
          type: array
          items:
            type: string
      required:
        - refinedCv
        - changes

    PracticeMode:
      type: string
      enum: [cv, job, custom]

    PracticeHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [ai, user]
        content:
          type: string
      required:
        - role
        - content

    PracticeStartInput:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/PracticeMode"
        jobTitle:
          type: string
        jobDescription:
          type: string
          minLength: 1
        topic:
          type: string
          minLength: 1
      required:
        - mode

    PracticeStartResult:
      type: object
      properties:
        intro:
          type: string
        firstQuestion:
          type: string
        questionNumber:
          type: integer
      required:
        - intro
        - firstQuestion
        - questionNumber

    PracticeMessageInput:
      type: object
      properties:
        mode:
          $ref: "#/components/schemas/PracticeMode"
        jobTitle:
          type: string
        jobDescription:
          type: string
        topic:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/PracticeHistoryMessage"
          minItems: 1
        answer:
          type: string
          minLength: 1
        questionNumber:
          type: integer
          minimum: 1
      required:
        - mode
        - history
        - answer
        - questionNumber

    PracticeMessageResult:
      type: object
      properties:
        feedback:
          type: string
        score:
          type: number
        nextQuestion:
          type: string
        isComplete:
          type: boolean
        summary:
          type: string
        questionNumber:
          type: integer
      required:
        - feedback
        - score
        - isComplete
        - questionNumber

    Job:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        title:
          type: string
        company:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        sector:
          type: ["string", "null"]
        category:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        experienceLevel:
          type: ["string", "null"]
        jobType:
          type: ["string", "null"]
        salaryRange:
          type: ["string", "null"]
        postedDate:
          type: ["string", "null"]
        deadline:
          type: ["string", "null"]
        applyUrl:
          type: ["string", "null"]
        applicationSteps:
          type: array
          items:
            type: string
        matchScore:
          type: ["number", "null"]
        createdAt:
          type: string
      required:
        - id
        - source
        - title
        - createdAt

    JobListResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
        - jobs
        - total
        - page
        - limit

    MatchedJob:
      type: object
      properties:
        job:
          $ref: "#/components/schemas/Job"
        matchScore:
          type: number
      required:
        - job
        - matchScore

    MatchedJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/MatchedJob"
        hasCV:
          type: boolean
      required:
        - jobs
        - hasCV

    SectorStat:
      type: object
      properties:
        sector:
          type: string
        count:
          type: integer
      required:
        - sector
        - count

    JobStats:
      type: object
      properties:
        total:
          type: integer
        bySector:
          type: array
          items:
            $ref: "#/components/schemas/SectorStat"
        recentCount:
          type: integer
      required:
        - total
        - bySector
        - recentCount

    MatchAnalysis:
      type: object
      properties:
        jobId:
          type: string
          minLength: 1
        matchScore:
          type: integer
        strengths:
          type: array
          items:
            type: string
        gaps:
          type: array
          items:
            type: string
        suggestions:
          type: array
          items:
            type: string
        cachedAt:
          type: string
      required:
        - jobId
        - matchScore
        - strengths
        - gaps
        - suggestions
        - cachedAt

    SavedJob:
      type: object
      properties:
        id:
          type: string
        userId:
          type: string
        jobId:
          type: string
        job:
          $ref: "#/components/schemas/Job"
        status:
          type: string
          enum: [saved, applied, interview, rejected, offer]
        notes:
          type: ["string", "null"]
        appliedAt:
          type: ["string", "null"]
        createdAt:
          type: string
      required:
        - id
        - userId
        - jobId
        - status
        - createdAt

    SavedJobInput:
      type: object
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [saved, applied, interview, rejected, offer]
        notes:
          type: string
      required:
        - jobId

    SavedJobUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [saved, applied, interview, rejected, offer]
        notes:
          type: string
        appliedAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Gig:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        title:
          type: string
        company:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        applyUrl:
          type: ["string", "null"]
        postedDate:
          type: ["string", "null"]
        taskType:
          type: ["string", "null"]
        payModel:
          type: ["string", "null"]
        estPayUSD:
          type: ["number", "null"]
        difficulty:
          type: ["string", "null"]
        legitScore:
          type: ["number", "null"]
        redFlags:
          type: array
          items:
            type: string
        enrichedAt:
          type: ["string", "null"]
        estMonthlyPKR:
          type: ["number", "null"]
        valueScore:
          type: ["number", "null"]
        valueIndicator:
          type: ["string", "null"]
        isRecurring:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - source
        - title
        - isRecurring
        - createdAt

    GigListResponse:
      type: object
      properties:
        gigs:
          type: array
          items:
            $ref: "#/components/schemas/Gig"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        usdToPkr:
          type: number
      required:
        - gigs
        - total
        - page
        - limit
        - usdToPkr

    SyncResult:
      type: object
      properties:
        inserted:
          type: integer
        updated:
          type: integer
        deleted:
          type: integer
        errors:
          type: integer
        message:
          type: string
      required:
        - inserted
        - updated
        - deleted
        - errors
        - message
