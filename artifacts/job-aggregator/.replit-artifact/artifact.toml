kind = "web"
previewPath = "/"
title = "Pakistani Job Aggregator"
version = "1.0.0"
id = "artifacts/job-aggregator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20358

[services.development]
run = "pnpm --filter @workspace/job-aggregator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/job-aggregator", "run", "build" ]
publicDir = "artifacts/job-aggregator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20358"
BASE_PATH = "/"
